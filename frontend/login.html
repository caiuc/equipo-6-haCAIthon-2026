<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU - Iniciar Sesión</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-container">
            <!-- El oso asomándose por la derecha -->
            <img src="images/cpucin-login.png" alt="Oso Mascota CPU" class="bear-mascot">
            
            <!-- Recuadro principal de Login -->
            <div class="login-box">
                <div class="login-header">
                    <h2>Bienvenido de vuelta</h2>
                    <p>Ingresa tus credenciales para continuar</p>
                </div>

                <form id="loginForm">
                    <!-- Grupo de Input: Correo / Usuario -->
                    <div class="input-group">
                        <img src="images/envelope.png" alt="Correo" class="input-icon">
                        <input type="text" id="username" name="username" placeholder="Usuario o Correo" required>
                    </div>

                    <!-- Grupo de Input: Contraseña -->
                    <div class="input-group">
                        <img src="images/lock.png" alt="Contraseña" class="input-icon">
                        <input type="password" id="password" name="password" placeholder="Contraseña" required>
                    </div>

                    <!-- Contenedor para mensajes de error de la API -->
                    <div id="errorMessage" class="error-message"></div>

                    <button type="submit" class="login-btn" id="submitBtn">Iniciar Sesión</button>
                </form>

                <div class="login-footer">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Lógica de Comunicación con la API -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Evita que la página se recargue al enviar el formulario
            
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('errorMessage');
            
            // Obtener los valores de los inputs
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;

            // Crear el objeto que enviaremos como JSON
            const payload = {
                usuario: usernameInput,
                password: passwordInput
            };

            try {
                // Estado de carga en el botón
                submitBtn.textContent = 'Verificando...';
                submitBtn.disabled = true;
                errorMessage.style.display = 'none';

                // REEMPLAZA ESTA URL CON LA DE TU API REAL
                const apiUrl = 'https://tu-api.com/api/auth/login'; 

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    // Si el login es exitoso, asumimos que la API devuelve { "token": "eyJhbG..." }
                    // Guardamos el JSON Web Token (JWT) en el LocalStorage
                    localStorage.setItem('jwtToken', data.token);
                    
                    // Redirigir al dashboard o página de inicio
                    submitBtn.textContent = '¡Éxito!';
                    window.location.href = 'index.html'; 
                } else {
                    // Mostrar error si las credenciales son incorrectas
                    throw new Error(data.message || 'Usuario o contraseña incorrectos.');
                }

            } catch (error) {
                // Manejo de errores (falla de red o credenciales inválidas)
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
                submitBtn.textContent = 'Iniciar Sesión';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
